<!doctype html>
<meta charset="utf-8">
<title>BasisPoints Transport</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:16px;color:#222;background:#fff}h2{margin:0 0 12px}.row{margin:12px 0}.hint{font-size:12px;color:#666;line-height:1.45}input,textarea,select{width:100%;box-sizing:border-box;padding:8px;margin-top:4px}button{padding:8px 14px;margin-right:8px}.ok{color:#067d34}.err{color:#b42318}label.inline{display:flex;gap:8px;align-items:center}label.inline input{width:auto;margin:0}.warn{padding:9px;background:#fff7ed;border:1px solid #fed7aa;font-size:12px;line-height:1.45}
</style>
<h2>BasisPoints Transport v0.2.1</h2>
<div class="warn">BasisPoints 会拒绝客户端直接携带的 tools。推荐使用“自动桥接”：插件删除客户端 tools，把工具目录写入 developer 消息，并把服务端 run_officejs 调用转换回客户端 function/custom tool call。</div>
<div class="row"><label class="inline"><input id="enabled" type="checkbox">启用 BasisPoints 路由</label></div>
<div class="row"><label>Endpoint<input id="endpoint"></label></div>
<div class="row"><label>模型（每行一个）<textarea id="models" rows="4"></textarea></label></div>
<div class="row"><label>Auth mode<input id="auth_mode" value="chatgpt"></label></div>
<div class="row"><label class="inline"><input id="copy_account_id" type="checkbox">复制 chatgpt-account-id → x-openai-account-id</label></div>
<div class="row"><label>工具兼容<select id="tool_bridge_mode"><option value="auto">自动桥接（推荐）</option><option value="off">关闭工具桥接（仅文本调试）</option></select></label><div class="hint">自动桥接不会把客户端 tool schema 发送给 BasisPoints；关闭后仍会移除 tools，但模型只能返回文本。</div></div>
<div class="row"><button id="save">保存</button><button id="test">测试已保存配置</button></div>
<div id="status"></div>
<script>
const token=new URLSearchParams(location.hash.slice(1)).get('bridge_token')||'';const pending=new Map();
function rid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function send(type,extra={}){const request_id=rid();parent.postMessage({source:'sub2api-plugin-ui',bridge_token:token,type,request_id,...extra},'*');return new Promise((resolve,reject)=>{const t=setTimeout(()=>{pending.delete(request_id);reject(new Error('timeout'))},10000);pending.set(request_id,{resolve,reject,t})})}
addEventListener('message',e=>{if(e.source!==parent)return;const d=e.data||{};if(d.source!=='sub2api-plugin-host'||d.bridge_token!==token||!pending.has(d.request_id))return;const p=pending.get(d.request_id);pending.delete(d.request_id);clearTimeout(p.t);d.ok?p.resolve(d):p.reject(new Error(d.error||d.message||'failed'))});
function form(){return{enabled:document.querySelector('#enabled').checked,endpoint:document.querySelector('#endpoint').value.trim(),models:document.querySelector('#models').value.split(/\n+/).map(x=>x.trim()).filter(Boolean),auth_mode:document.querySelector('#auth_mode').value.trim()||'chatgpt',copy_account_id:document.querySelector('#copy_account_id').checked,tool_bridge_mode:document.querySelector('#tool_bridge_mode').value,request_timeout_seconds:0}}
function render(c){document.querySelector('#enabled').checked=c.enabled!==false;document.querySelector('#endpoint').value=c.endpoint||'https://bps.openai.com/basispoints/api/responses';document.querySelector('#models').value=(c.models||['gpt-6-astra','gpt-5.6-sol']).join('\n');document.querySelector('#auth_mode').value=c.auth_mode||'chatgpt';document.querySelector('#copy_account_id').checked=c.copy_account_id!==false;document.querySelector('#tool_bridge_mode').value=c.tool_bridge_mode||'auto'}
function stat(msg,ok=true){const e=document.querySelector('#status');e.className=ok?'ok':'err';e.textContent=msg}
document.querySelector('#save').onclick=async()=>{try{const r=await send('config.save',{config:form()});render(r.config||form());stat('已保存')}catch(e){stat(e.message,false)}};
document.querySelector('#test').onclick=async()=>{try{const r=await send('config.test');stat((r.result&&r.result.message)||'测试通过')}catch(e){stat(e.message,false)}};
(async()=>{parent.postMessage({source:'sub2api-plugin-ui',bridge_token:token,type:'sub2api.plugin.ready',request_id:rid()},'*');try{const r=await send('config.load');render(r.config||{})}catch(e){render({});stat(e.message,false)}parent.postMessage({source:'sub2api-plugin-ui',bridge_token:token,type:'ui.resize',request_id:rid(),height:600},'*')})();
</script>
